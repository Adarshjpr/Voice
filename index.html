<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Recorder</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; max-width: 520px; margin: auto; }
  button, select { padding: 12px; margin: 5px 0; border-radius: 6px; font-size: 15px; width: 100%; }
  button { border: none; cursor: pointer; }
  #startBtn { background: #4CAF50; color: #fff; }
  #stopBtn  { background: #f44336; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 12px; font-weight: bold; }
  #transcript { margin-top: 10px; padding: 10px; background: #f1f1f1; border-radius: 6px;
                min-height: 70px; font-size: 14px; white-space: pre-wrap; }
  .warn { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px; border-radius: 6px; font-size: 13px; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <h2>🎙️ Voice Recorder</h2>
  <div id="targetBox"></div>

  <select id="lang">
    <option value="en-US">English (US)</option>
    <option value="en-IN">English (India)</option>
    <option value="hi-IN">हिन्दी</option>
  </select>

  <button id="startBtn" onclick="startRecording()">Start Recording</button>
  <button id="stopBtn" onclick="stopRecording()" disabled>Stop &amp; Save</button>

  <div id="status">Idle</div>
  <div id="transcript"></div>

<script>
  // Deploy ke baad ka /exec URL
  const WEBAPP_URL = "https://script.google.com/a/macros/uncodemy.com/s/AKfycbydsovZOQnKXLeLnGu6uztyY9Q7Qw-lRmTGAAWJSohklISpeRNvNaXymst-1qmRyOzOuQ/exec";

  const targetCell = new URLSearchParams(window.location.search).get('target');

  let recognition = null;
  let finalTranscript = '';
  let interimTranscript = '';
  let userStopped = false;

  const $ = id => document.getElementById(id);
  const setStatus = t => { $('status').innerText = t; };

  // Target cell ka saaf status — bina target ke chalega to nayi row me jayega
  $('targetBox').innerHTML = targetCell
    ? '<p class="muted">Target cell: <b>' + targetCell.replace(/[<>&]/g, '') + '</b></p>'
    : '<div class="warn">⚠️ Koi target cell nahi mila. Ye page Sheet ke <b>Voice Recorder → Open Recorder</b> menu se kholo, warna transcript nayi row me jayega.</div>';

  function startRecording() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setStatus('Ye browser support nahi karta — Chrome use karo.'); return; }

    finalTranscript = '';
    interimTranscript = '';
    userStopped = false;
    $('transcript').innerText = '';
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
    setStatus('🔴 Recording... boliye');

    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = $('lang').value;

    recognition.onresult = event => {
      interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript + ' ';
        } else {
          interimTranscript += event.results[i][0].transcript;
        }
      }
      $('transcript').innerText = finalTranscript + interimTranscript;
    };

    recognition.onerror = e => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;  // ye normal hain
      setStatus('⚠️ Error: ' + e.error);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        userStopped = true;
        $('startBtn').disabled = false;
        $('stopBtn').disabled = true;
      }
    };

    // Chrome silence par apne aap band karta hai -> restart, save nahi
    recognition.onend = () => {
      if (!userStopped) {
        try { recognition.start(); } catch (err) { save(); }
      } else {
        save();
      }
    };

    recognition.start();
  }

  function stopRecording() {
    userStopped = true;
    $('startBtn').disabled = false;
    $('stopBtn').disabled = true;
    setStatus('Finishing transcript...');
    if (recognition) { recognition.stop(); } else { save(); }
  }

  function save() {
    const text = (finalTranscript + ' ' + interimTranscript).trim();

    // Khali transcript kabhi mat bhejo — yahi "(no transcript)" wali rows banata tha
    if (!text) {
      setStatus('❌ Kuch sunai nahi diya. Kuch save nahi hua — dobara try karo.');
      return;
    }

    setStatus('Saving...');
    fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ transcript: text, target: targetCell })
    })
    .then(() => {
      setStatus('✅ Bheja gaya' + (targetCell ? ' → ' + targetCell : ' (nayi row)') + '. Sheet check karo.');
    })
    .catch(err => setStatus('❌ Failed: ' + err.message));
  }
</script>
</body>
</html>
